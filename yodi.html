<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የህይወት ጉዟችን - 60 ቀናት</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between">

    <!-- LANDING PAGE SECTION -->
    <div id="landingPage" class="flex flex-col items-center justify-center min-h-screen px-6 text-center bg-gradient-to-b from-blue-950 via-black to-black">
        <div class="max-w-md mx-auto space-y-6">
            <div class="w-20 h-20 bg-pink-500 rounded-full flex items-center justify-center mx-auto shadow-lg shadow-pink-500/30 animate-pulse">
                <i class="fa-solid fa-heart text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-wide text-blue-400">የህይወት ጉዟችን</h1>
            <p class="text-gray-300 text-sm md:text-base leading-relaxed">
                የተለመደውን የካፌ ውሎ ትተን፤ የሰውን ልጅ ህይወት፣ እምነት፣ ተፈጥሮ እና እውነተኛውን ማህበራዊ ኑሮ በአንድነት የምንቃኝበት የ 60 ቀናት ልዩ ምዕራፍ።
            </p>
            <button onclick="startJourney()" class="w-full py-4 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105">
                ጉዞአችንን ጀምር ✨
            </button>
        </div>
    </div>

    <!-- MAIN APP SECTION (Hidden by default) -->
    <div id="mainApp" class="hidden flex-col min-h-screen bg-black text-white">
        <!-- Header -->
        <header class="py-6 px-4 bg-blue-950/40 border-b border-blue-900/50 text-center sticky top-0 z-10 backdrop-blur-md">
            <h2 class="text-xl md:text-2xl font-bold text-blue-400">የ 60 ቀናት የህይወት ጉዞ እቅድ</h2>
            <p class="text-xs text-gray-400 mt-1">ቀኑን ሲነኩ የዕለቱን ሀሳብ ያገኛሉ (በቀን 1 ብቻ)</p>
        </header>

        <!-- Grid Container -->
        <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">
            <div id="gridContainer" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-3 md:gap-4">
                <!-- Buttons will be injected dynamically via JavaScript -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-4 text-center text-xs text-gray-500 border-t border-gray-900">
            Created with ❤️ for Us
        </footer>
    </div>

    <!-- MODAL POPUP -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-blue-950 border border-blue-800 rounded-2xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl relative">
            <div id="modalIcon" class="w-12 h-12 bg-pink-600 rounded-full flex items-center justify-center mx-auto text-white text-xl">
                <i class="fa-solid fa-star"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-blue-300">ቀን 1</h3>
            <p id="modalText" class="text-gray-200 text-sm leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white font-medium rounded-xl transition-all">
                እሺ (ተረድቻለሁ)
            </button>
        </div>
    </div>

    <!-- JavaScript Link -->
    <script src="yodi.js"></script>
</body>
</html>
